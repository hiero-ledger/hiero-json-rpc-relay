name: Dev Tool Tests

on:
  pull_request:
    branches: [main, release/**]
  push:
    branches: [main, release/**]
    tags: [v*]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  hardhat:
    name: Hardhat
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/dev-tool-workflow.yml
    with:
      command: cd ./tools/hardhat-example/ && npx hardhat test
      directory: ./tools/hardhat-example

  web3js:
    name: Web3js
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/dev-tool-workflow.yml
    needs: [hardhat]
    with:
      command: cd ./tools/web3js-example/ && npm run test
      directory: ./tools/web3js-example

  golang-http:
    name: Golang HTTP
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/dev-tool-workflow.yml
    with:
      command: cd ./tools/golang-json-rpc-tests/ && go run .
      directory: ./tools/golang-json-rpc-tests

  golang-wss:
    name: Golang WSS
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/dev-tool-workflow.yml
    with:
      command: cd ./tools/golang-json-rpc-tests/ && go run . --wss
      directory: ./tools/golang-json-rpc-tests
