name: Foundry tool test

on: workflow_dispatch

env:
  FOUNDRY_PROFILE: ci

permissions:
  contents: read

jobs:
  check:
    defaults:
      run:
        working-directory: ./tools/foundry-example/
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: hiero-smart-contracts-linux-medium
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Foundry
        uses: step-security/foundry-toolchain@dd5624465228cd300f5431ab9f181efc4cec0a95 # v1.9.1
        with:
          version: nightly

      - name: Run Forge build
        run: |
          forge --version
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test
