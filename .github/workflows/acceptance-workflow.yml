name: Reusable acceptance tests workflow

on:
  workflow_call:
    inputs:
      testfilter:
        required: true
        type: string
      test_ws_server:
        required: false
        default: false
        type: boolean
      test_rate_limits:
        required: false
        default: false
        type: boolean
      on_valid_json_rpc_http_response_status_code:
        required: false
        default: 400
        type: number
      envfile:
        required: false
        default: localAcceptance.env
        type: string
      operator_id:
        required: false
        type: string
      networkTag:
        required: false
        type: string
      mirrorTag:
        required: false
        type: string
      relayTag:
        required: false
        type: string
      soloVersion:
        required: false
        type: string
    secrets:
      operator_key:
        description: 'The ED25519, ECDSA, or DER encoded private key of the operator'
        required: false

permissions:
  contents: read

jobs:
  acceptance-workflow:
    runs-on: hiero-smart-contracts-linux-large
    timeout-minutes: 50
    permissions:
      contents: read
      checks: write
    steps:
      - name: Set env variables
        run: |
          if [ -n "${{ inputs.operator_id }}" ]; then
            echo "OPERATOR_ID_MAIN=${{ inputs.operator_id }}" >> $GITHUB_ENV
          fi

      - name: Set rate limiting variables
        if: ${{ inputs.test_rate_limits == true }}
        run: |
          echo "RATE_LIMIT_DISABLED=false" >> $GITHUB_ENV
          echo "DEFAULT_RATE_LIMIT=200" >> $GITHUB_ENV
          echo "TIER_1_RATE_LIMIT=100" >> $GITHUB_ENV
          echo "TIER_2_RATE_LIMIT=800" >> $GITHUB_ENV
          echo "TIER_3_RATE_LIMIT=1600" >> $GITHUB_ENV
          echo "LIMIT_DURATION=60000" >> $GITHUB_ENV

      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install make
        run: sudo apt-get update; sudo apt-get install build-essential -y

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install packages
        run: npm ci

      - name: Create .env file
        run: cp ./tests/server/${{ inputs.envfile }} .env

      - name: Build Typescript
        run: npm run build

      - name: Load pinned versions
        run: grep -vE '^[[:space:]]*(#|$)' .github/network-versions.env >> "$GITHUB_ENV"

      - name: Generate falcon-values config file
        run: |
          cat > .github/falcon.yml <<EOF
          network:
            --consensus-node-version: "${{ inputs.networkTag || env.NETWORK_TAG }}"
            --node-aliases: "node1"
          setup:
            --consensus-node-version: "${{ inputs.networkTag || env.NETWORK_TAG }}"
            --node-aliases: "node1"
          consensusNode:
            --node-aliases: "node1"
          mirrorNode:
            --enable-ingress: true
            --pinger: true
            --mirror-node-version: "${{ inputs.mirrorTag || env.MIRROR_NODE_TAG }}"
            --values-file: .github/mirror-node-values.yaml
          EOF

      - name: Setup Kind
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true
          node_image: kindest/node:v1.32.5@sha256:e3b2327e3a5ab8c76f5ece68936e4cafaa82edf58486b769727ab0b3b97a5b0d
          version: v0.29.0
          kubectl_version: v1.32.5
          verbosity: 3
          wait: 120s

      - name: Start the solo node
        env:
          MIRROR_NODE_PORT: 5551
          GRPC_LOCAL_PORT: 50211
        run: |
          npx @hashgraph/solo@${{ inputs.soloVersion || env.SOLO_VERSION }} one-shot falcon deploy \
            --values-file .github/falcon.yml \
            --external-address 0.0.0.0 \
            --dev \
            --deploy-explorer=false \
            --deploy-relay=false
        timeout-minutes: 15

      - name: Start Redis
        run: docker run -d --name redis -p 6379:6379 redis:7-alpine

      - name: Run acceptance tests
        run: |
          if [[ -n "$OPERATOR_KEY" ]] && [[ "$OPERATOR_KEY" != "" ]]; then
            echo "Overriding OPERATOR_KEY_MAIN with the secret value"
            export OPERATOR_KEY_MAIN="$OPERATOR_KEY"
          fi
          npm run acceptancetest:${{ inputs.testfilter }}
        env:
          TEST_WS_SERVER: ${{ inputs.test_ws_server }}
          SUBSCRIPTIONS_ENABLED: ${{ inputs.test_ws_server }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PR_NUMBER: ${{ github.event.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPERATOR_KEY: ${{ secrets.operator_key }}
          ON_VALID_JSON_RPC_HTTP_RESPONSE_STATUS_CODE: '${{ inputs.on_valid_json_rpc_http_response_status_code }}'

      - name: Capture mirror node logs
        if: failure()
        run: |
          NS="$(kubectl get ns -o name | sed 's|^namespace/||' | grep 'hiero' | head -n1)"
          mkdir -p mirror-node-logs
          kubectl get pods -n "$NS" -o wide > mirror-node-logs/pods.txt 2>&1 || true
          for pod in $(kubectl get pods -n "$NS" --no-headers -o custom-columns=:metadata.name | grep -E 'mirror|web3'); do
            kubectl logs -n "$NS" "$pod" --all-containers --tail=5000 > "mirror-node-logs/${pod}.log" 2>&1 || true
            kubectl describe pod -n "$NS" "$pod" > "mirror-node-logs/${pod}.describe.txt" 2>&1 || true
          done

      - name: Upload mirror node logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mirror-node-logs-${{ inputs.testfilter }}-${{ inputs.on_valid_json_rpc_http_response_status_code }}
          path: mirror-node-logs/
          if-no-files-found: warn

      - name: Upload Heap Snapshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Heap Snapshots
          path: '**/*.heapsnapshot'
          if-no-files-found: ignore

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Test Results (${{ inputs.testfilter }}) ${{ inputs.on_valid_json_rpc_http_response_status_code}}
          path: test-*.xml

      - name: Publish Test Report
        uses: step-security/publish-unit-test-result-action@8cf946dca1a299ebf36dff640273fda13717050a # v2.24.0
        if: ${{ github.actor != 'dependabot[bot]' && !cancelled() }}
        with:
          check_name: '' # Set to empty to disable check run
          comment_mode: off
          json_thousands_separator: ','
          files: 'test-*.xml'
          github_token: ${{ secrets.GITHUB_TOKEN }}
