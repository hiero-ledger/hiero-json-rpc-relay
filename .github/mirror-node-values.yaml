# Solo caps the importer at 220Mi, too little for the TSS proof in a Block Node's first block
importer:
  resources:
    limits:
      memory: 1Gi
web3:
  env:
    HIERO_MIRROR_WEB3_OPCODE_TRACER_ENABLED: "true"
    HIERO_MIRROR_WEB3_EVM_NETWORK: "OTHER"
    HIERO_MIRROR_WEB3_API_CALL_REQUEST_TIMEOUT: "10s"
    HIERO_MIRROR_WEB3_ENABLE_STATE_OVERRIDES: "true"
    HIERO_MIRROR_WEB3_API_PRESTATE_ENABLED: "true"
