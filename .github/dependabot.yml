version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/k6"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 1
      include:
        - "*"
    groups:
      npm-weekly:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions-weekly:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      docker-weekly:
        applies-to: version-updates
        patterns:
          - "*"
