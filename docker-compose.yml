version: "3.7"
services:
  relay:
    container_name: hedera-json-rpc-relay
    image: "ghcr.io/hiero-ledger/hiero-json-rpc-relay:main"
    restart: "unless-stopped"
    ports:
      - 7546:7546
    pull_policy: always
    tty: true
    volumes:
      - ./.env:/home/node/app/.env
    environment:
      RPC_HTTP_ENABLED: "true"
      RPC_WS_ENABLED: "false"
      REDIS_ENABLED: true
      REDIS_URL: "redis://redis:6379"

  relay-ws:
    container_name: hedera-json-rpc-relay-ws
    image: "ghcr.io/hiero-ledger/hiero-json-rpc-relay:main"
    # Uses the image default CMD (dist/index.js); the transport is selected with env vars,
    # matching the Helm websocket chart and the `start:ws` script in package.json.
    environment:
      RPC_HTTP_ENABLED: "false"
      RPC_WS_ENABLED: "true"
      HEALTHCHECK_PORT: 8547
      SUBSCRIPTIONS_ENABLED: true
      REDIS_ENABLED: true
      REDIS_URL: "redis://redis:6379"
    restart: "unless-stopped"
    ports:
      - 8546:8546
      - 8547:8547
    pull_policy: always
    tty: true
    volumes:
      - ./.env:/home/node/app/.env

  redis:
    image: redis@sha256:9c6bb76658f8e6f7ca8d0d96c8fcdfb12e9795579c89918aea4fa2ad9817c2f0 # 8.0-M04-bookworm
    container_name: redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always

volumes:
  redis-data:
